[project]
name = "dm-control-purple-agent-baseline"
version = "0.1.0"
description = "Baseline purple agent for DeepMind Control Suite evaluation (A2A)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "a2a-sdk[http-server]>=0.3.20",
    "uvicorn>=0.38.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.1",
]
